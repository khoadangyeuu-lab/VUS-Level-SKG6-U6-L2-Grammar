<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 6 – L2 Grammar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2B4F; --ink-soft:#5A6788;
  --paper:#F2F7FF; --grid:#DFEAFB; --card:#FFFFFF; --line:#D4E0F3;
  --sun:#FFC93C; --sun-deep:#D9A112;
  --grass:#25A96A; --grass-deep:#1A7F4F;
  --berry:#E5484D; --berry-deep:#B32F34;
  /* one color per possessive word, the same in every activity */
  --p-mine:#E2342F; --p-yours:#3560B0; --p-his:#1B7F6A; --p-hers:#C2407E;
  --p-ours:#D9791F; --p-theirs:#6B55A6; --p-whose:#A6781F;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Nunito",system-ui,sans-serif; color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px; min-height:100dvh; -webkit-tap-highlight-color:transparent; overflow-x:clip;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:10px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px clamp(16px,4vw,40px)}
.brand{display:flex;align-items:center;gap:14px}
.brand-badge{width:52px;height:52px;border-radius:16px;background:var(--sun);box-shadow:0 5px 0 var(--sun-deep);display:grid;place-items:center;flex:none}
.brand-badge svg{width:30px;height:30px}
.brand small{display:block;font-weight:800;color:var(--ink-soft);font-size:.9rem;letter-spacing:.01em}
.brand h1{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.3rem,2.6vw,1.75rem);line-height:1.1}
.tabs{display:flex;background:#fff;border:2px solid var(--line);box-shadow:0 5px 0 var(--line);border-radius:999px;padding:5px;gap:4px}
.tab{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;padding:10px 18px;border-radius:999px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;transition:background .2s,color .2s;white-space:nowrap}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;box-shadow:0 3px 0 #0E1630}
.tab:not([aria-selected="true"]):hover{color:var(--ink);background:var(--paper)}
main{padding:0 clamp(16px,4vw,40px) 28px}
.view[hidden]{display:none}
/* the question block sits in the middle of the free space under the bar */
@media (min-width:761px){
  body{display:flex;flex-direction:column}
  main{flex:1;display:flex;flex-direction:column}
  .view:not([hidden]){flex:1;display:flex;flex-direction:column}
  .game{flex:1;display:flex;flex-direction:column}
  .qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:2vh}
}

/* chunky buttons */
.btn{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s,background .2s}
.btn svg{width:20px;height:20px;flex:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn-primary{background:var(--sun);border-color:var(--sun-deep);box-shadow:0 5px 0 var(--sun-deep);font-size:1.2rem;padding:14px 28px}
.btn-primary:active{box-shadow:0 2px 0 var(--sun-deep)}
.btn-go{background:var(--sun);border-color:var(--sun-deep);box-shadow:0 4px 0 var(--sun-deep)}
.btn-go:active{box-shadow:0 1px 0 var(--sun-deep)}
.btn-sm{padding:8px 14px;font-size:.95rem}
.btn-sm svg{width:18px;height:18px}
.btn-icon{padding:11px;border-radius:50%}

/* game bar */
.game{width:min(100%,980px);margin:0 auto}
.gbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.round-label{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.25rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chip{font-family:"Nunito",sans-serif;font-weight:800;font-size:.9rem;padding:6px 12px;border-radius:999px;background:#fff;border:2px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--line);transition:all .25s}
.dot.cur{border-color:var(--ink);transform:scale(1.25)}
.dot.ok{background:var(--grass);border-color:var(--grass)}
.dot.late{background:#fff;border:4px solid var(--grass)}
.dot.no{background:var(--berry);border-color:var(--berry)}
.dot.shown{background:var(--ink-soft);border-color:var(--ink-soft)}
.gright{display:flex;align-items:center;gap:14px}
.score{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.15rem;display:flex;align-items:center;gap:6px}
.score svg{width:26px;height:26px}
.score.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25)}}

/* question stage: picture tile on the left, speech-bubble card on the right */
.qz{display:grid;grid-template-columns:auto minmax(0,1fr);gap:34px;align-items:center;justify-content:center;width:100%;max-width:920px;margin:0 auto}
.qz.deal>*{animation:deal .45s cubic-bezier(.3,1.4,.5,1) both}
.qz.deal>*:nth-child(2){animation-delay:.07s}
@keyframes deal{from{opacity:0;transform:translateY(18px) scale(.94)}}
.itemtile{position:relative;width:clamp(170px,calc(100dvh - 460px),300px);aspect-ratio:1/1;border-radius:26px;background:#fff;border:3px solid var(--line);box-shadow:0 7px 0 var(--line);transition:border-color .3s,box-shadow .3s}
.itemtile.done{border-color:color-mix(in srgb,var(--c) 45%,white);box-shadow:0 7px 0 color-mix(in srgb,var(--c) 45%,white)}
.tilein{position:absolute;inset:0;border-radius:23px;overflow:hidden;display:grid;place-items:center;background:#fff}
.tilein img{width:86%;height:86%;object-fit:contain;pointer-events:none;user-select:none}
.tilein.empty{background:repeating-linear-gradient(-45deg,#fff 0 14px,var(--paper) 14px 28px)}
.noimg{display:grid;justify-items:center;gap:8px;text-align:center;padding:12px;color:var(--ink-soft)}
.noimg svg{width:48%;height:auto;stroke-width:1.7}
.noimg span{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(1rem,1.9vw,1.4rem);color:var(--ink);line-height:1.15}
/* the swinging "Whose?" tag that turns into the answer */
.owner{position:absolute;top:-18px;right:-20px;z-index:3;font-family:"Fredoka",sans-serif;font-weight:700;font-size:1.2rem;line-height:1;padding:8px 15px 8px 26px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:13px;box-shadow:0 4px 0 var(--ink);transform-origin:12% 50%;animation:swing 2.6s ease-in-out infinite;white-space:nowrap}
.owner::before{content:"";position:absolute;left:9px;top:50%;width:9px;height:9px;border-radius:50%;border:2.5px solid currentColor;transform:translateY(-50%)}
@keyframes swing{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-5deg)}}
.itemtile.done .owner{background:var(--c);color:#fff;border-color:color-mix(in srgb,var(--c) 70%,black);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,black);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}

.card{position:relative;text-align:left;background:#fff;border:3px solid var(--line);box-shadow:0 7px 0 var(--line);border-radius:var(--r-lg);padding:24px 30px 26px}
.card::before{content:"";position:absolute;left:-13px;top:50%;width:22px;height:22px;background:#fff;border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.sent{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(1.35rem,2.7vw,2rem);line-height:1.95}
.nw{white-space:nowrap}
.blank{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;line-height:1;min-width:min(160px,34vw);height:54px;margin:0 4px;padding:0 16px;border-radius:14px;border:3px dashed var(--ink-soft);background:repeating-linear-gradient(-45deg,#fff 0 12px,var(--paper) 12px 24px);font-family:"Fredoka",sans-serif;font-weight:700;font-size:inherit;color:#fff}
.blank.filled{background:var(--c);border:3px solid var(--c);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 70%,black);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.blank.wrongfill{background:var(--berry);border:3px solid var(--berry);box-shadow:0 5px 0 var(--berry-deep);animation:shake .4s}

/* chat time */
.chat{display:grid;gap:16px}
.msg{display:flex;align-items:flex-end;gap:12px}
.msg.b{flex-direction:row-reverse}
.ava{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-weight:700;font-size:1.3rem}
.msg.a .ava{background:var(--ink);color:#fff;box-shadow:0 4px 0 #0E1630}
.msg.b .ava{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 var(--sun-deep)}
.bub{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(1.15rem,2.2vw,1.6rem);line-height:1.85;padding:8px 20px;border-radius:22px;min-width:0}
.msg.a .bub{background:var(--paper);border:2px solid var(--line);border-bottom-left-radius:6px}
.msg.b .bub{background:#FFF6DC;border:2px solid #F2DE9E;border-bottom-right-radius:6px}
.bub .blank{min-width:min(130px,30vw);height:48px}

/* switch it */
.swap{display:grid;gap:4px}
.srow2{display:grid;grid-template-columns:var(--lw) minmax(0,1fr);align-items:center;gap:14px}
.swap{--lw:84px}
.lbl{justify-self:start;font-family:"Nunito",sans-serif;font-weight:800;font-size:.85rem;color:var(--ink-soft);background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:3px 0;width:var(--lw);text-align:center}
.srow2.now .lbl{background:var(--ink);border-color:var(--ink);color:#fff}
.sent.was{font-size:clamp(1.15rem,2.2vw,1.6rem);color:var(--ink-soft);line-height:1.6}
.sent.was mark{background:linear-gradient(transparent 56%,#FFE07A 56%);color:var(--ink);padding:0 3px}
.arrow{width:var(--lw);display:grid;place-items:center;color:var(--ink-soft);height:30px}
.arrow svg{width:26px;height:26px}

/* spot it */
.toks{display:flex;flex-wrap:wrap;align-items:center;gap:26px 10px;padding-top:18px}
.wtile{position:relative;font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(1.25rem,2.5vw,1.85rem);line-height:1.2;padding:8px 16px;border-radius:14px;background:#fff;border:3px solid var(--line);box-shadow:0 5px 0 var(--line);transition:transform .08s,box-shadow .08s,border-color .2s}
.wtile:not([disabled]):hover{border-color:var(--ink-soft)}
.wtile:not([disabled]):active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.wtile[disabled]{cursor:default}
.wtile.tried{opacity:.4;border-style:dashed;box-shadow:none;animation:shake .4s}
.wtile.fixed{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 70%,black);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.wtile.fixed s{position:absolute;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%);font-size:.58em;font-weight:700;color:var(--berry-deep);white-space:nowrap;text-decoration-thickness:2px}
.pu{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.25rem,2.5vw,1.85rem);margin-left:3px}

/* answers */
.panel{margin-top:30px;text-align:center}
.options{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.opt{background:#fff;border:3px solid var(--line);box-shadow:0 6px 0 var(--line);border-radius:20px;position:relative;transition:transform .08s,box-shadow .08s,border-color .2s}
.opt:hover{border-color:var(--ink-soft)}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.opt.txt{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.4rem,3vw,2rem);padding:14px 34px;min-width:150px}
.opt .key{position:absolute;top:-10px;left:-10px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-family:"Nunito",sans-serif;font-weight:800;font-size:.85rem;display:grid;place-items:center;z-index:2}
.opt.ok{border-color:var(--grass);box-shadow:0 6px 0 var(--grass-deep);background:#E6F7EE}
.opt.no{border-color:var(--berry);box-shadow:0 6px 0 var(--berry-deep);background:#FDECEC;animation:shake .4s}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.ok):not(.no){opacity:.45}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.bank{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;background:var(--grid);border-radius:22px;padding:14px 20px;width:fit-content;max-width:100%;margin:0 auto}
.bank-label{font-weight:800;color:var(--ink-soft);font-size:.95rem;margin-right:4px}
.wchip{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(1.15rem,2.2vw,1.5rem);padding:9px 24px;border-radius:16px;background:#fff;border:3px solid color-mix(in srgb,var(--c) 40%,white);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 40%,white);color:var(--ink);transition:transform .1s,box-shadow .1s,background .2s,color .2s}
.wchip:not([disabled]):hover{border-color:var(--c)}
.wchip:not([disabled]):active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 40%,white)}
.wchip.sel{background:var(--c);color:#fff;border-color:var(--c);box-shadow:0 8px 0 color-mix(in srgb,var(--c) 70%,black);transform:translateY(-3px)}
.wchip.tried{opacity:.3;box-shadow:none;border-style:dashed;cursor:default}
.wchip[disabled]{cursor:default}
.feedback{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.35rem;margin:22px 0 0;min-height:56px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.feedback .btn{color:var(--ink)}
.feedback.good{color:var(--grass-deep)}
.feedback.bad{color:var(--berry-deep)}
.answord{display:inline-block;color:#fff;background:var(--c);padding:3px 12px;border-radius:10px;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,black);line-height:1.2}

/* confetti */
.confetti{position:absolute;width:0;height:0;pointer-events:none;z-index:8}
.confetti i{position:absolute;left:0;top:0;width:10px;height:15px;border-radius:3px;background:var(--k);animation:fly .95s cubic-bezier(.2,.8,.3,1) forwards;animation-delay:var(--d)}
@keyframes fly{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1);opacity:0}}

/* context line above the main sentence */
.ctx{font-family:"Fredoka",sans-serif;font-weight:500;font-size:clamp(1.05rem,2vw,1.4rem);color:var(--ink-soft);line-height:1.4;margin-bottom:4px}
.ctx+.toks{padding-top:14px}
kbd{font-family:"Nunito",sans-serif;font-weight:800;font-size:.8rem;line-height:1;color:var(--ink-soft);background:var(--paper);border:2px solid var(--line);border-bottom-width:3px;border-radius:7px;padding:3px 7px;margin-left:2px}

/* grammar box */
.modal.wide .modal-card{width:min(100%,940px)}
.gq{display:block;font-family:"Fredoka",sans-serif;font-weight:500;font-size:clamp(1.05rem,1.9vw,1.3rem);color:var(--ink-soft);margin-top:4px}
.gq b{color:var(--p-whose)}
.gq .ans,.gex .ans{color:#fff;background:var(--c);border-radius:8px;padding:0 9px;font-weight:700}
.gbox{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.gcard{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:16px;padding:12px 16px 12px 12px;background:#fff;border:3px solid color-mix(in srgb,var(--c) 30%,white);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 30%,white);border-radius:22px}
.gpic{width:clamp(70px,11dvh,96px);aspect-ratio:1/1;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden}
.gpic img{width:100%;height:100%;object-fit:contain}
.gpic svg{width:60%;color:var(--ink-soft)}
.gpair{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(1.15rem,2vw,1.45rem)}
.gpair svg{width:20px;height:20px;color:var(--ink-soft)}
.gto{color:#fff;background:var(--c);border-radius:10px;padding:2px 12px;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,black)}
.gex{font-family:"Fredoka",sans-serif;font-weight:500;font-size:clamp(.95rem,1.6vw,1.1rem);color:var(--ink-soft);line-height:1.5;margin-top:6px}
@media (max-width:700px){ .gbox{grid-template-columns:1fr} }

/* answer key */
.modal{position:fixed;inset:0;z-index:20;background:rgba(30,43,79,.45);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal-card{position:relative;background:#fff;border:3px solid var(--line);box-shadow:0 8px 0 var(--line);border-radius:30px;width:min(100%,780px);max-height:calc(100dvh - 32px);overflow:auto;padding:24px 28px 18px;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.modal-card h2{font-family:"Fredoka",sans-serif;font-weight:700;font-size:1.7rem;margin-bottom:8px;padding-right:56px}
.mclose{position:absolute;top:16px;right:16px}
.klist{list-style:none}
.klist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:11px 0;border-top:2px dashed var(--line)}
.klist .num{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-family:"Fredoka",sans-serif;font-weight:700;display:grid;place-items:center}
.ktext{font-family:"Fredoka",sans-serif;font-weight:500;font-size:clamp(1.05rem,1.9vw,1.35rem);line-height:1.55}
.ktext .kl{display:block}
.ktext .kfrom{color:var(--ink-soft)}
.ktext .ans{color:#fff;background:var(--c);border-radius:8px;padding:0 9px;font-weight:700}
.ktext s{color:var(--berry-deep);font-weight:600;text-decoration-thickness:2px}

@media (min-width:641px) and (max-height:780px){
  .top{padding-top:12px;padding-bottom:10px}
  .brand-badge{width:46px;height:46px;border-radius:14px}
  .gbar{margin-bottom:16px}
  .itemtile{width:clamp(150px,calc(100dvh - 450px),250px)}
  .card{padding:18px 26px 20px}
  .sent{line-height:1.8}
  .blank{height:48px}
  .chat{gap:10px}
  .panel{margin-top:22px}
  .feedback{margin-top:16px}
  .opt.txt{padding:11px 30px}
  .bank{padding:10px 18px} .wchip{padding:7px 22px}
}
/* big projector / TV screens: scale everything up a step */
@media (min-width:1600px) and (min-height:950px){
  html{font-size:18.5px}
  .game{width:min(100%,1180px)}
  .qz{max-width:1120px}
  .itemtile{width:clamp(170px,calc(100dvh - 540px),380px)}
  .blank{height:62px}
  .modal-card{width:min(100%,900px)} .modal.wide .modal-card{width:min(100%,1080px)}
}
@media (max-width:900px){
  .top{justify-content:center}
}
@media (max-width:760px){
  .qz{grid-template-columns:1fr;justify-items:center;gap:28px}
  .card{width:100%;padding:18px 20px 20px}
  .card::before{left:50%;top:-13px;border-bottom:0;border-top:3px solid var(--line);transform:translateX(-50%) rotate(45deg)}
  .itemtile{width:clamp(130px,30dvh,200px)}
  .srow2{grid-template-columns:1fr;gap:2px}
}
@media (max-width:640px){
  .tab span{display:none} .tab{padding:10px 16px}
  .gright .btn-sm span{display:none} .gright .btn-sm{padding:8px} kbd{display:none}
  .opt.txt{padding:12px 22px;min-width:96px}
  .options{gap:14px}
  .wchip{padding:8px 16px}
  .owner{right:-14px;font-size:1.05rem}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

let actx=null;
function tone(freqs,dur=.12,type="sine",vol=.18){ try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume();
  let t=actx.currentTime+.01;
  freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain(); o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.02);t+=dur*.85;});}catch(e){} }

  bad:()=>tone([330,247],.2,"triangle",.16),                       /* wrong answer: soft "uh-oh" */

/* ---------- helpers ---------- */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function spacedSeq(items,rounds,gap,avoid=()=>false){ const seq=[],used=new Map(items.map(i=>[i,0]));
  for(let r=0;r<rounds;r++){ const recent=seq.slice(-gap), prev=seq[seq.length-1];
    let pool=items.filter(i=>!recent.includes(i));
    const min=Math.min(...pool.map(i=>used.get(i))); pool=pool.filter(i=>used.get(i)===min);
    const far=pool.filter(i=>prev===undefined||!avoid(i,prev)); if(far.length) pool=far;
    const pick=pool[Math.random()*pool.length|0]; seq.push(pick); used.set(pick,used.get(pick)+1);} return seq; }
function burst(host,color,n=18,top='50%'){
  if(!host||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  const c=document.createElement('div'); c.className='confetti'; c.style.left='50%'; c.style.top=top;
  const cols=['#FFC93C','#25A96A',color,'#1E2B4F','#FFC93C',color];
  const r=host.getBoundingClientRect(), cx=r.left+r.width/2, lo=14-cx, hi=innerWidth-14-cx;
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, d=70+Math.random()*100, el=document.createElement('i');
    el.style.cssText=`--k:${cols[i%cols.length]};--x:${Math.min(hi,Math.max(lo,Math.cos(a)*d)).toFixed(0)}px;--y:${(Math.sin(a)*d-30).toFixed(0)}px;--r:${(Math.random()*720-360)|0}deg;--d:${(Math.random()*90)|0}ms`;
    c.appendChild(el); }
  host.appendChild(c); setTimeout(()=>c.remove(),1300);
}
const pk=w=>w.toLowerCase().replace(/[^a-z]/g,'');
const pcol=w=>`var(--p-${pk(w)})`;
const PUNCT=/^[.,!?]+$/;
function splitPost(post){ const lead=(post.match(/^[.,!?]*/)||[''])[0]; return [lead,post.slice(lead.length).trim()]; }
function gapHtml(pre,post){ const [lead,rest]=splitPost(post);
  return `${pre?pre+' ':''}<span class="nw"><span class="blank" role="img" aria-label="gap"></span>${lead}</span>${rest?' '+rest:''}`; }
function joinText(pre,w,post){ const [lead,rest]=splitPost(post); return `${pre?pre+' ':''}${w}${lead}${rest?' '+rest:''}`; }
function keyHtml(pre,w,post){ return joinText(pre,`<span class="ans" style="--c:${pcol(w)}">${w}</span>`,post); }

  pick:{tab:'Pick it!',icon:'bulb',chip:'Choose the right word',data:PICK,mode:'choice',
    body:q=>`${ctxHtml(q)}<p class="sent">${gapHtml(q.pre,q.post)}</p>`,
    text:(q,w)=>joinText(q.pre,w,q.post),
    key:q=>ctxKey(q)+keyHtml(q.pre,q.ans,q.post)},
  chat:{tab:'Chat time',icon:'chat',chip:'Fill the gap',data:CHAT,mode:'bank',
    body:q=>`<div class="chat"><div class="msg a"><span class="ava" aria-hidden="true">A</span><div class="bub">${lineHtml(q.a)}</div></div><div class="msg b"><span class="ava" aria-hidden="true">B</span><div class="bub">${lineHtml(q.b)}</div></div></div>`,
    text:(q,w)=>line(q.a,w)+' '+line(q.b,w),
    key:q=>`<span class="kl"><b>A:</b> ${lineKey(q.a,q.ans)}</span><span class="kl"><b>B:</b> ${lineKey(q.b,q.ans)}</span>`},
  swap:{tab:'Switch it!',icon:'swap',chip:'Say it another way',data:SWAP,mode:'choice',
    body:q=>`<div class="swap"><div class="srow2"><span class="lbl">Before</span><p class="sent was">${q.from[0]} <mark>${q.from[1]}</mark>${q.from[2]}</p></div><div class="arrow">${ic('down')}</div><div class="srow2 now"><span class="lbl">Now</span><p class="sent">${gapHtml(q.to[0],q.to[1])}</p></div></div>`,
    text:(q,w)=>joinText(q.to[0],w,q.to[1]),
    key:q=>`<span class="kl kfrom">${q.from.join(' ').replace(' .','.')}</span><span class="kl">→ ${keyHtml(q.to[0],q.ans,q.to[1])}</span>`},
  spot:{tab:'Spot it!',icon:'search',chip:'Tap the wrong word',data:SPOT,mode:'spot',
    body:q=>`${ctxHtml(q)}<div class="toks">${toksHtml(q)}</div>`,
    text:(q,w)=>w===null?spotJoin(q,x=>x.bad):spotJoin(q,x=>x.fix),
    key:q=>ctxKey(q)+spotJoin(q,x=>`<s>${x.bad}</s> <span class="ans" style="--c:${pcol(x.fix)}">${x.fix}</span>`)}
};
const ctxHtml=q=>q.ctx?`<p class="ctx">${q.ctx}</p>`:'';
const ctxKey=q=>q.ctx?`<span class="kfrom">${q.ctx}</span> `:'';
const ORDER=['pick','chat','swap','spot'];
let cur='pick';

function prep(id){ const g=G[id];
  if(g.mode==='choice'){ const pos=spacedSeq([0,1,2],g.data.length,1);
    return g.data.map((q,i)=>{ const rest=shuffle(q.opts.filter(o=>o!==q.ans)); let r=0;
      return {...q,opts:[0,1,2].map(k=>k===pos[i]?q.ans:rest[r++])}; }); }
  if(g.mode==='bank') return g.data.map(q=>({...q,bank:shuffle(BANK)}));
  return g.data.map(q=>({...q}));
}

function shell(id){ const g=G[id];
  return `<div class="game">
    <div class="gbar">
      <div class="round-label"><span class="qn">Question 1 of 5</span><span class="chip">${ic(g.icon)}${g.chip}</span></div>
      <div class="dots" aria-hidden="true"></div>
      <div class="gright"><button class="btn btn-sm gboxbtn" aria-label="Grammar box">${ic('book')}<span>Grammar box</span></button><button class="btn btn-sm keybtn" aria-label="Answer key">${ic('key')}<span>Answer key</span></button>
        <div class="score" aria-live="polite">${starSvg(true)}<b>0</b></div></div>
    </div>
    <div class="qwrap"></div>
  </div>`; }

function tile(q){ const src=IMGS[q.item];
  return `<div class="itemtile" style="--c:${pcol(q.ans)}"><div class="tilein${src?'':' empty'}">${src?`<img src="${src}" alt="${LABEL[q.item]}">`:`<div class="noimg">${ic('hanger')}<span>${LABEL[q.item]}</span></div>`}</div><span class="owner">Whose?</span></div>`; }

function controls(id,q){ const g=G[id];
  if(g.mode==='choice') return `<div class="options">${q.opts.map((o,k)=>`<button class="opt txt" data-o="${o}" aria-label="${'ABC'[k]}: ${o}"><span class="key">${'ABC'[k]}</span>${o}</button>`).join('')}</div>`;
  if(g.mode==='bank') return `<div class="bank"><span class="bank-label">Word bank</span>${q.bank.map((w,k)=>`<button class="wchip" data-o="${w}" style="--c:${pcol(w)}" aria-label="${k+1}: ${w}">${w}</button>`).join('')}</div>`;
  return '';
}
const showBtn=()=>`<button class="btn showans" title="Right arrow key" aria-keyshortcuts="ArrowRight">${ic('eye')}Show answer<kbd aria-hidden="true">→</kbd></button>`;

function start(id){ const g=G[id];
  if(!g.root){ g.root=$('#v-'+id); g.root.innerHTML=shell(id);
    $('.keybtn',g.root).onclick=()=>openKey(id);
    $('.gboxbtn',g.root).onclick=openGbox; }
  g.st={i:0,score:0,res:[],qs:prep(id)};
  $('.score b',g.root).textContent='0';
  render(id);
}

function render(id){ const g=G[id], s=g.st, q=s.qs[s.i], root=g.root;
  $('.qn',root).textContent=`Question ${s.i+1} of ${s.qs.length}`;
  drawDots(id);
  const w=$('.qwrap',root);
  w.innerHTML=`<div class="qz deal">${tile(q)}<div class="card">${g.body(q)}</div></div>
    <div class="panel">${controls(id,q)}<div class="feedback">${showBtn()}</div></div>`;
  s.locked=false; s.missed=false;
  $('.showans',w).onclick=()=>conclude(id,'shown');
  if(g.mode==='choice') $$('.opt',w).forEach(b=>b.onclick=()=>pickChoice(id,b));
  if(g.mode==='bank') $$('.wchip',w).forEach(b=>b.onclick=()=>pickBank(id,b));
  if(g.mode==='spot') $$('.wtile',w).forEach(b=>b.onclick=()=>pickSpot(id,b));
}

function drawDots(id){ const s=G[id].st;
  $('.dots',G[id].root).innerHTML=s.qs.map((_,k)=>`<span class="dot ${s.res[k]||''} ${k===s.i&&!s.res[k]?'cur':''}"></span>`).join(''); }

function tryAgain(id,msg){ const fb=$('.feedback',G[id].root);
  fb.className='feedback bad'; fb.innerHTML=`<span>${msg}</span>${showBtn()}`;
  $('.showans',fb).onclick=()=>conclude(id,'shown'); }

function pickChoice(id,b){ const s=G[id].st, q=s.qs[s.i]; if(s.locked||s.res[s.i]) return;
  const ok=b.dataset.o===q.ans; if(!ok) b.classList.add('no');
  conclude(id,ok?'ok':'no'); }

function pickBank(id,b){ const g=G[id], s=g.st, q=s.qs[s.i]; if(s.locked||s.res[s.i]||b.classList.contains('tried')) return;
  if(b.dataset.o===q.ans){ b.classList.add('sel'); conclude(id,s.missed?'late':'ok'); return; }
  s.missed=true; s.locked=true;
  b.classList.add('tried'); b.disabled=true;
  const blank=$('.blank',g.root); blank.textContent=b.dataset.o; blank.classList.add('wrongfill');
  tryAgain(id,'Not quite. Try again!');
  setTimeout(()=>{ if(G[id].st!==s||s.res[s.i]) return; blank.textContent=''; blank.classList.remove('wrongfill'); s.locked=false; },750);
}

function pickSpot(id,b){ const s=G[id].st; if(s.locked||s.res[s.i]) return;
  if(b.dataset.bad==='1'){ conclude(id,s.missed?'late':'ok'); return; }
  s.missed=true; b.classList.add('tried'); b.disabled=true;
  tryAgain(id,'That word is OK. Try again!');
}

function conclude(id,kind){ const g=G[id], s=g.st, q=s.qs[s.i], root=g.root;
  if(s.res[s.i]) return; s.res[s.i]=kind; s.locked=true;
  const t=$('.itemtile',root); t.classList.add('done'); $('.owner',t).textContent=q.tag||q.ans;
  if(g.mode==='spot'){ const b=$('.wtile[data-bad="1"]',root); b.classList.add('fixed'); b.style.setProperty('--c',pcol(q.fix));
    b.innerHTML=`<s>${q.bad}</s>${q.fix}`; b.setAttribute('aria-label',`${q.bad}, fixed: ${q.fix}`); }
  else{ const bl=$('.blank',root); bl.classList.remove('wrongfill'); bl.classList.add('filled'); bl.style.setProperty('--c',pcol(q.ans)); bl.textContent=q.ans; bl.setAttribute('aria-label',q.ans); }
  $$('.opt',root).forEach(o=>{ o.disabled=true; if(o.dataset.o===q.ans) o.classList.add('ok'); });
  $$('.wchip',root).forEach(c=>{ c.disabled=true; if(c.dataset.o===q.ans) c.classList.add('sel'); });
  $$('.wtile',root).forEach(w=>w.disabled=true);
  if(kind==='ok'){ s.score++; const sc=$('.score',root); $('b',sc).textContent=s.score; sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump'); }
  drawDots(id);
  const A=`<b class="answord" style="--c:${pcol(q.ans)}">${q.ans}</b>`;
  const msg={ok:'Great job!',late:"That's it! Well done.",no:`Oops! The answer is ${A}.`,
    shown:g.mode==='spot'?`The wrong word is “${q.bad}”. Say ${A}.`:`The answer is ${A}.`}[kind];
  const last=s.i===s.qs.length-1, fb=$('.feedback',root), nid=ORDER[(ORDER.indexOf(id)+1)%ORDER.length];
  fb.className='feedback '+(kind==='ok'||kind==='late'?'good':kind==='no'?'bad':'');
  fb.innerHTML=`<span>${msg}</span><button class="btn btn-go next">${last?(nid===ORDER[0]?'Back to ':'Next: ')+G[nid].tab:'Next question'}${ic('next')}</button>`;
  const nx=$('.next',fb); nx.onclick=()=>{ if(!last){ s.i++; render(id); } else goActivity(nid); };
  ({ok:sfx.good,late:sfx.good,no:sfx.bad,shown:sfx.reveal})[kind]();
  if(kind==='ok'||kind==='late'){ burst(t,getComputedStyle(document.documentElement).getPropertyValue('--p-'+pk(q.ans)).trim()||'#FFC93C'); }
  nx.focus({preventScroll:true});
}

/* ---------- answer key ---------- */
const modal=$('#modal'); let lastFocus=null;
function openKey(id){ const g=G[id]; lastFocus=document.activeElement;
  $('#mtitle').textContent=`Answer key: ${g.tab}`;
  $('#mbody').innerHTML=`<ol class="klist">${g.data.map((q,i)=>`<li><span class="num">${i+1}</span><div class="ktext">${g.key(q)}</div></li>`).join('')}</ol>`;
  modal.classList.remove('wide'); modal.hidden=false; $('#mclose').focus(); }
function openGbox(){ lastFocus=document.activeElement;
  $('#mtitle').innerHTML=`Grammar box <span class="gq"><b>Whose</b> striped shirt is this? It's <span class="ans" style="--c:var(--p-mine)">mine</span>.</span>`;
  $('#mbody').innerHTML=`<div class="gbox">${GBOX.map(g=>`<div class="gcard" style="--c:${pcol(g.p)}">
      <div class="gpic">${IMGS[g.item]?`<img src="${IMGS[g.item]}" alt="">`:ic('hanger')}</div>
      <div class="gtxt"><div class="gpair"><span class="gfrom">${g.w} ${g.n}</span>${ic('next')}<span class="gto">${g.p}</span></div>
      <p class="gex">${keyHtml(g.ex[0],g.p,g.ex[1])}</p></div></div>`).join('')}</div>`;
  modal.classList.add('wide'); modal.hidden=false; $('#mclose').focus(); }
function closeKey(){ modal.hidden=true; if(lastFocus) lastFocus.focus({preventScroll:true}); }
$('#mclose').innerHTML=ic('close'); $('#mclose').onclick=closeKey;
modal.addEventListener('click',e=>{ if(e.target===modal) closeKey(); });

/* ---------- tabs, keys ---------- */
$('#tabs').innerHTML=ORDER.map((id,i)=>`<button class="tab" role="tab" id="t-${id}" aria-controls="v-${id}" aria-selected="${i===0}" aria-label="${G[id].tab}">${ic(G[id].icon)}<span>${G[id].tab}</span></button>`).join('');
function showTab(id){ cur=id;
  ORDER.forEach(k=>{ $('#t-'+k).setAttribute('aria-selected',k===id); $('#v-'+k).hidden=k!==id; });
  const st=G[id].st;
  if(!st||st.res.filter(Boolean).length===st.qs.length) start(id);   // new, or already finished: start fresh
  window.scrollTo({top:0}); }
ORDER.forEach(id=>$('#t-'+id).onclick=()=>showTab(id));
const goActivity=id=>showTab(id);

document.addEventListener('keydown',e=>{
  if(!modal.hidden){ if(e.key==='Escape') closeKey(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='ArrowRight'){ const g=G[cur]; if(!g.st) return;
    e.preventDefault();
    if(!g.st.res[g.st.i]) conclude(cur,'shown');      // 1st press: show the answer
    else { const nx=$('.next',g.root); if(nx) nx.click(); }  // 2nd press: next question
    return; }
  if(e.key.length!==1) return;
  const g=G[cur]; if(!g.st||g.st.locked||g.st.res[g.st.i]) return;
  const k=e.key.toLowerCase();
  if(g.mode==='choice'){ let i='abc'.indexOf(k); if(i<0) i='123'.indexOf(k); const b=i>=0&&$$('.opt',g.root)[i]; if(b&&!b.disabled) b.click(); }
  if(g.mode==='bank'){ const i='12345'.indexOf(k); const b=i>=0&&$$('.wchip',g.root)[i]; if(b&&!b.disabled) b.click(); }
});

showTab('pick');
</script>
</body>
</html>
